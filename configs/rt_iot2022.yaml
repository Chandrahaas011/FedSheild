project: shift_aware_compact_ids
dataset: rt_iot2022
raw_path: data/raw/rt-iot2022/RT_IOT2022
dataset_path: data/processed/research_rt_iot2022.parquet
metadata_path: data/processed/research_rt_iot2022_metadata.json
task: binary
seeds: [0, 1, 2, 3, 4]

# RT-IoT2022 is small enough to use in full after leakage-safe cleaning.
max_train_rows: null
max_validation_rows: null
max_test_rows: null

models:
  - decision_tree
  - hist_gradient_boosting

heldout_attack_families:
  - DOS_SYN_Hping
  - ARP_poisioning
  - NMAP_UDP_SCAN
  - DDOS_Slowloris

fpr_constraint: 0.01
uncertainty_alpha: 0.10
uncertainty_target_coverage: 0.90
uncertainty_validation_roles: [0.40, 0.30, 0.30]
density_fusion_weight: 0.50
density_reference_rows_per_class: 50000
output_dir: results/metrics
artifact_dir: models/artifacts
