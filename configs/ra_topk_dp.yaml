# Flagship method: Residual-Adaptive Top-k (RA-TopK) plus record-level DP-SGD.
# Each client sends the smallest bounded set of residual-corrected update coordinates
# that retains the configured fraction of update energy.
experiment_name: ra_topk_dp
method: ra_topk_dp
model: mlp
seed: 0
data_frac: 0.3

n_clients: 10
alpha: 0.5
n_rounds: 20
fraction_fit: 1.0
local_epochs: 1
lr: 0.01
batch_size: 256
adaptive_min_ratio: 0.02
adaptive_max_ratio: 0.20
adaptive_energy_target: 0.90
dp: true
dp_noise_multiplier: 1.0
dp_max_grad_norm: 1.0
rounds_per_checkpoint: 5
