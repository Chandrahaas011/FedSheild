project: domain_shift_window_sensitivity
dataset_version: NetFlow-v2-label-blind-v1
processed_dir: data/processed/netflow_v2_label_blind
metadata_path: data/processed/netflow_v2_label_blind/metadata.json
output_dir: results/metrics
artifact_dir: models/artifacts
seeds: [0, 1, 2, 3, 4]
sampling_mode: global_label_blind
maximum_train_rows: 140000
maximum_validation_rows: 60000
maximum_target_test_rows: 200000
feature_transform: signed_log1p

domain_shift_validation:
  experiment_prefix: domain_validation_window_sensitivity
  protocol_name: label_blind_shift_window_sensitivity
  window_sizes: [128, 256, 512, 1024]
  window_size: 512
  quantile_bins: 10
  calibration_alpha: 0.05
  maximum_reference_rows: 100000
  maximum_ks_reference_rows: 4096
  minimum_calibration_windows: 10
  mixture_fractions: [0.0, 0.10, 0.25, 0.50, 0.75, 1.0]
  # Eight is feasible for the smallest source mixture role at 1,024 flows and is
  # held constant across every window size for a fair comparison.
  mixture_windows_per_fraction: 8
  maximum_source_audit_false_alarm_rate: 0.10
  primary_method: jsd_mean
  comparison_methods: [jsd_mean, psi_mean, ks_mean]

exclude_name_patterns:
  - IPV4_SRC_ADDR
  - IPV4_DST_ADDR
  - L4_SRC_PORT
  - L4_DST_PORT
  - FLOW_ID
  - TIMESTAMP
  - DNS_QUERY_ID
