# Flagship config: top-k sparsification + DP-SGD (Opacus), reported epsilon.
# This is what backs the project title's "privacy-preserving" claim (ROADMAP.md §0) —
# FL alone is not privacy-preserving; DP-SGD with a reported epsilon is required.
experiment_name: topk_dp
method: topk_dp
model: mlp
seed: 0
data_frac: 0.3

n_clients: 10
alpha: 0.5
n_rounds: 20
fraction_fit: 1.0
local_epochs: 1
lr: 0.01
batch_size: 256
topk_ratio: 0.1
dp: true
dp_noise_multiplier: 1.0
dp_max_grad_norm: 1.0
rounds_per_checkpoint: 5
