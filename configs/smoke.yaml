# Smoke-test config: fast end-to-end pipeline check on a small data subsample.
# ROADMAP.md Phase 3: "a smoke-test config (subsampled data, few rounds) so full runs
# are never burned on debugging." Not used for reported results.
experiment_name: smoke
method: topk_dp
model: mlp
seed: 0
data_frac: 0.02

n_clients: 5
alpha: 0.5
n_rounds: 3
fraction_fit: 1.0
local_epochs: 1
lr: 0.01
batch_size: 128
topk_ratio: 0.1
dp: true
dp_noise_multiplier: 1.0
dp_max_grad_norm: 1.0
rounds_per_checkpoint: 2
