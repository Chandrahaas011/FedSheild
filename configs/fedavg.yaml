# Vanilla FedAvg baseline (dense updates, no sparsification, no DP).
experiment_name: fedavg
method: fedavg
model: mlp
seed: 0
data_frac: 0.3

n_clients: 10
alpha: 0.5
n_rounds: 20
fraction_fit: 1.0
local_epochs: 1
lr: 0.01
batch_size: 256
topk_ratio: -1
dp: false
dp_noise_multiplier: 1.0
dp_max_grad_norm: 1.0
rounds_per_checkpoint: 5
